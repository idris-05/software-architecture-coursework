<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALC — Distributed Calculator</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html, body { background-color: #030712; }
        body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const REST_BASE = "http://localhost:8080/api";
        const SOAP_URL  = "http://localhost:8081/calc";

        const OPERATIONS = [
            { value: "add",      label: "Addition (+)",        symbol: "+" },
            { value: "subtract", label: "Subtraction (−)",     symbol: "−" },
            { value: "multiply", label: "Multiplication (×)",  symbol: "×" },
            { value: "divide",   label: "Division (÷)",        symbol: "÷" }
        ];

        const PAGE_SIZES = [5, 10, 20];

        function formatNum(n) {
            if (n === null || n === undefined || isNaN(n)) return "";
            return parseFloat(Number(n).toPrecision(6)).toString();
        }

        async function callRest(operation, a, b) {
            const response = await fetch(`${REST_BASE}/${operation}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ a, b })
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            return data.result;
        }

        async function callSoap(operation, a, b) {
            const xml =
`<?xml version="1.0" encoding="utf-8"?>
<soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"
               xmlns:tns="http://soap.calc/">
  <soap:Body>
    <tns:${operation}>
      <a>${a}</a>
      <b>${b}</b>
    </tns:${operation}>
  </soap:Body>
</soap:Envelope>`;
            const response = await fetch(SOAP_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "text/xml; charset=utf-8",
                    "SOAPAction": `"${operation}"`
                },
                body: xml
            });
            const text = await response.text();
            const doc = new DOMParser().parseFromString(text, "text/xml");
            const fault = doc.getElementsByTagName("faultstring")[0];
            if (fault) throw new Error(fault.textContent);
            const returnEl = doc.getElementsByTagName("return")[0];
            return parseFloat(returnEl.textContent);
        }

        async function fetchHistory() {
            const response = await fetch(`${REST_BASE}/history`);
            return response.json();
        }

        function getPageWindow(current, total) {
            const windowSize = 5;
            if (total <= windowSize) {
                return Array.from({ length: total }, (_, i) => i + 1);
            }
            let start = current - 2;
            let end = current + 2;
            if (start < 1) {
                end += (1 - start);
                start = 1;
            }
            if (end > total) {
                start -= (end - total);
                end = total;
                if (start < 1) start = 1;
            }
            const pages = [];
            for (let i = start; i <= end; i++) pages.push(i);
            return pages;
        }

        function OperationBadge({ via }) {
            if (via === "REST") {
                return (
                    <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-900/40 text-blue-300 border border-blue-700">
                        REST
                    </span>
                );
            }
            return (
                <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-900/40 text-amber-300 border border-amber-700">
                    SOAP
                </span>
            );
        }

        function ResultBlock({ label, loading, error, result, color }) {
            return (
                <div className="mt-2 min-h-[1.25rem] text-sm">
                    {loading && <span className="text-gray-400">Computing...</span>}
                    {!loading && error && <span className="text-red-400">Error: {error}</span>}
                    {!loading && !error && result !== null && (
                        <span className={color}>Result: {formatNum(result)}</span>
                    )}
                </div>
            );
        }

        function InputField({ label, value, onChange }) {
            return (
                <div className="flex-1">
                    <label className="block text-xs uppercase tracking-wider text-gray-400 mb-1">{label}</label>
                    <input
                        type="number"
                        step="any"
                        value={value}
                        onChange={(e) => onChange(e.target.value)}
                        className="w-full bg-gray-900 border border-gray-700 rounded-md px-3 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                    />
                </div>
            );
        }

        function OperationSelect({ value, onChange }) {
            return (
                <div>
                    <label className="block text-xs uppercase tracking-wider text-gray-400 mb-1">Operation</label>
                    <select
                        value={value}
                        onChange={(e) => onChange(e.target.value)}
                        className="w-full bg-gray-900 border border-gray-700 rounded-md px-3 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                    >
                        {OPERATIONS.map((op) => (
                            <option key={op.value} value={op.value}>{op.label}</option>
                        ))}
                    </select>
                </div>
            );
        }

        function PageSizeSelect({ value, onChange }) {
            return (
                <div className="flex items-center gap-2">
                    <label className="text-xs uppercase tracking-wider text-gray-400">Rows per page:</label>
                    <select
                        value={value}
                        onChange={(e) => onChange(e.target.value)}
                        className="bg-gray-900 border border-gray-700 rounded-md px-2 py-1 text-sm text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                        {PAGE_SIZES.map((n) => (
                            <option key={n} value={n}>{n}</option>
                        ))}
                    </select>
                </div>
            );
        }

        function Pagination({ currentPage, totalPages, onPageChange }) {
            if (totalPages <= 1) return null;
            const pages = getPageWindow(currentPage, totalPages);
            const baseBtn = "px-3 py-1 rounded-md text-sm border transition-colors";
            const enabled = "border-gray-700 bg-gray-900 text-gray-200 hover:bg-gray-800";
            const disabled = "border-gray-800 bg-gray-950 text-gray-600 cursor-not-allowed";
            return (
                <div className="flex flex-col items-center gap-3 mt-4">
                    <div className="flex items-center gap-2 flex-wrap justify-center">
                        <button
                            disabled={currentPage === 1}
                            onClick={() => onPageChange(currentPage - 1)}
                            className={`${baseBtn} ${currentPage === 1 ? disabled : enabled}`}
                        >
                            ← Prev
                        </button>
                        {pages.map((n) => {
                            const active = n === currentPage;
                            const cls = active
                                ? `${baseBtn} border-indigo-500 bg-indigo-600 text-white`
                                : `${baseBtn} ${enabled}`;
                            return (
                                <button key={n} onClick={() => onPageChange(n)} className={cls}>
                                    {n}
                                </button>
                            );
                        })}
                        <button
                            disabled={currentPage === totalPages}
                            onClick={() => onPageChange(currentPage + 1)}
                            className={`${baseBtn} ${currentPage === totalPages ? disabled : enabled}`}
                        >
                            Next →
                        </button>
                    </div>
                    <div className="text-xs text-gray-500">
                        Page {currentPage} of {totalPages}
                    </div>
                </div>
            );
        }

        function App() {
            const [numA, setNumA] = useState("");
            const [numB, setNumB] = useState("");
            const [operator, setOperator] = useState("add");

            const [restResult, setRestResult] = useState(null);
            const [soapResult, setSoapResult] = useState(null);
            const [restError, setRestError] = useState("");
            const [soapError, setSoapError] = useState("");
            const [restLoading, setRestLoading] = useState(false);
            const [soapLoading, setSoapLoading] = useState(false);

            const [history, setHistory] = useState([]);
            const [historyLoading, setHistoryLoading] = useState(false);
            const [historyError, setHistoryError] = useState("");
            const [historyVisible, setHistoryVisible] = useState(false);

            const [pageSize, setPageSize] = useState(10);
            const [currentPage, setCurrentPage] = useState(1);

            const operatorSymbol = useMemo(() => {
                const op = OPERATIONS.find((o) => o.value === operator);
                return op ? op.symbol : "+";
            }, [operator]);

            const totalPages = Math.max(1, Math.ceil(history.length / pageSize));
            const pagedHistory = useMemo(
                () => history.slice((currentPage - 1) * pageSize, currentPage * pageSize),
                [history, currentPage, pageSize]
            );

            useEffect(() => {
                if (currentPage > totalPages) setCurrentPage(totalPages);
            }, [totalPages, currentPage]);

            async function handleRestCompute() {
                setRestLoading(true);
                setRestError("");
                setRestResult(null);
                const a = parseFloat(numA);
                const b = parseFloat(numB);
                if (isNaN(a) || isNaN(b)) {
                    setRestError("Invalid numbers");
                    setRestLoading(false);
                    return;
                }
                try {
                    const result = await callRest(operator, a, b);
                    setRestResult(result);
                } catch (err) {
                    setRestError(err.message);
                } finally {
                    setRestLoading(false);
                }
            }

            async function handleSoapCompute() {
                setSoapLoading(true);
                setSoapError("");
                setSoapResult(null);
                const a = parseFloat(numA);
                const b = parseFloat(numB);
                if (isNaN(a) || isNaN(b)) {
                    setSoapError("Invalid numbers");
                    setSoapLoading(false);
                    return;
                }
                try {
                    const result = await callSoap(operator, a, b);
                    setSoapResult(result);
                } catch (err) {
                    setSoapError(err.message);
                } finally {
                    setSoapLoading(false);
                }
            }

            async function handleShowHistory() {
                setHistoryVisible(true);
                setHistoryLoading(true);
                setHistoryError("");
                setCurrentPage(1);
                try {
                    const records = await fetchHistory();
                    const newestFirst = Array.isArray(records) ? records.slice().reverse() : [];
                    setHistory(newestFirst);
                } catch (err) {
                    setHistoryError(err.message);
                } finally {
                    setHistoryLoading(false);
                }
            }

            function handleHideHistory() {
                setHistoryVisible(false);
            }

            function handlePageSizeChange(value) {
                setPageSize(parseInt(value, 10));
                setCurrentPage(1);
            }

            function handlePageChange(newPage) {
                const clamped = Math.max(1, Math.min(totalPages, newPage));
                setCurrentPage(clamped);
            }

            const startRecord = history.length === 0 ? 0 : (currentPage - 1) * pageSize + 1;
            const endRecord = Math.min(currentPage * pageSize, history.length);

            return (
                <div className="min-h-screen p-6 md:p-10">
                    <div className="max-w-lg mx-auto bg-gray-900 border border-gray-800 rounded-2xl shadow-xl p-6 md:p-8">
                        <h1 className="text-3xl font-bold tracking-tight text-center text-white">CALC</h1>
                        <p className="text-center text-sm text-gray-400 mt-1 mb-6">
                            Distributed Calculator — REST &amp; SOAP
                        </p>

                        <div className="flex gap-3">
                            <InputField label="First Number"  value={numA} onChange={setNumA} />
                            <InputField label="Second Number" value={numB} onChange={setNumB} />
                        </div>

                        <div className="mt-4">
                            <OperationSelect value={operator} onChange={setOperator} />
                        </div>

                        <div className="mt-4">
                            <button
                                onClick={handleRestCompute}
                                disabled={restLoading}
                                className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:bg-indigo-900 disabled:text-indigo-400 text-white font-semibold py-2 px-4 rounded-md transition-colors"
                            >
                                Compute via REST
                            </button>
                            <ResultBlock
                                loading={restLoading}
                                error={restError}
                                result={restResult}
                                color="text-emerald-400"
                            />
                        </div>

                        <hr className="my-6 border-gray-800" />

                        <div>
                            <button
                                onClick={handleSoapCompute}
                                disabled={soapLoading}
                                className="w-full bg-amber-600 hover:bg-amber-500 disabled:bg-amber-900 disabled:text-amber-400 text-white font-semibold py-2 px-4 rounded-md transition-colors"
                            >
                                Compute via SOAP
                            </button>
                            <ResultBlock
                                loading={soapLoading}
                                error={soapError}
                                result={soapResult}
                                color="text-emerald-400"
                            />
                        </div>

                        <div className="mt-6">
                            {!historyVisible ? (
                                <button
                                    onClick={handleShowHistory}
                                    className="w-full bg-gray-800 hover:bg-gray-700 text-gray-100 font-semibold py-2 px-4 rounded-md border border-gray-700 transition-colors"
                                >
                                    Show History
                                </button>
                            ) : (
                                <button
                                    onClick={handleHideHistory}
                                    className="w-full bg-gray-800 hover:bg-gray-700 text-gray-100 font-semibold py-2 px-4 rounded-md border border-gray-700 transition-colors"
                                >
                                    Hide History
                                </button>
                            )}
                        </div>
                    </div>

                    {historyVisible && (
                        <div className="max-w-5xl mx-auto mt-6 bg-gray-900 border border-gray-800 rounded-2xl shadow-xl p-6 md:p-8">
                            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-4">
                                <h2 className="text-xl font-semibold text-white">
                                    Operation History{" "}
                                    <span className="text-sm font-normal text-gray-400">
                                        ({history.length} total records)
                                    </span>
                                </h2>
                                <PageSizeSelect value={pageSize} onChange={handlePageSizeChange} />
                            </div>

                            {historyLoading && (
                                <div className="text-gray-400 text-sm py-6 text-center">Loading history...</div>
                            )}

                            {!historyLoading && historyError && (
                                <div className="text-red-400 text-sm py-4">Error: {historyError}</div>
                            )}

                            {!historyLoading && !historyError && history.length === 0 && (
                                <div className="text-gray-500 text-sm py-6 text-center">
                                    No operations recorded yet.
                                </div>
                            )}

                            {!historyLoading && !historyError && history.length > 0 && (
                                <>
                                    <div className="overflow-x-auto max-h-[28rem] overflow-y-auto rounded-lg border border-gray-800">
                                        <table className="w-full text-sm">
                                            <thead className="bg-gray-800 text-gray-200 sticky top-0">
                                                <tr>
                                                    <th className="px-3 py-2 text-right">#</th>
                                                    <th className="px-3 py-2 text-left">Timestamp</th>
                                                    <th className="px-3 py-2 text-left">Operation</th>
                                                    <th className="px-3 py-2 text-left">Via</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {pagedHistory.map((rec, idx) => (
                                                    <tr
                                                        key={rec.id}
                                                        className={idx % 2 === 0 ? "bg-gray-900" : "bg-gray-800/50"}
                                                    >
                                                        <td className="px-3 py-2 text-right text-gray-400">{rec.id}</td>
                                                        <td className="px-3 py-2 mono text-gray-300">{rec.timestamp}</td>
                                                        <td className="px-3 py-2 mono text-gray-100">
                                                            {formatNum(rec.operandA)} {rec.operator} {formatNum(rec.operandB)} = {formatNum(rec.result)}
                                                        </td>
                                                        <td className="px-3 py-2">
                                                            <OperationBadge via={rec.via} />
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>

                                    <Pagination
                                        currentPage={currentPage}
                                        totalPages={totalPages}
                                        onPageChange={handlePageChange}
                                    />

                                    <div className="text-xs text-gray-500 text-center mt-3">
                                        Showing records {startRecord} to {endRecord} of {history.length}
                                    </div>
                                </>
                            )}
                        </div>
                    )}

                    <footer className="max-w-5xl mx-auto mt-6 text-center text-xs text-gray-600">
                        Expression preview: {numA || "0"} {operatorSymbol} {numB || "0"}
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
